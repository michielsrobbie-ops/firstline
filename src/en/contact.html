<!--
title: Contact – First Line, Kranevo
description: First Line Restaurant &amp; Bar, Central Beach, 9649 Kranevo. Phone +359 88 686 1001. Book a table or enquire about a wedding or corporate event.
og_image: img/home-hero.jpg
-->
<main id="top">

  <section class="page-hero page-hero-simple">
    <div class="wrap">
      <h1>Contact</h1>
      <p class="lead">Call to book a table or send us an enquiry about an event.</p>
    </div>
  </section>

  <section class="contact" id="zapitvane">
    <div class="wrap contact-grid">
      <div>
        <dl class="contact-list">
          <div><dt>Address</dt><dd>Central Beach, 9649 Kranevo</dd></div>
          <div><dt>Phone</dt><dd><a href="tel:+359886861001">+359 88 686 1001</a></dd></div>
          <div><dt>Email</dt><dd><a href="mailto:kranevo.firstline@gmail.com">kranevo.firstline@gmail.com</a></dd></div>
          <div><dt>Social media</dt><dd><a href="https://www.facebook.com/firstlinebar" rel="noopener">Facebook</a> and <a href="https://www.instagram.com/first_line_restaurant_kranevo/" rel="noopener">Instagram</a></dd></div>
        </dl>
        <iframe class="map" title="Map: First Line on Central Beach in Kranevo" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=43.3431436,28.0705318&amp;z=16&amp;hl=en&amp;output=embed"></iframe>
        <p class="map-link"><a class="text-link" href="https://www.google.com/maps/search/?api=1&amp;query=43.3431436,28.0705318" rel="noopener">Directions in Google Maps</a></p>
      </div>

      <form class="form" data-form action="https://formsubmit.co/ajax/kranevo.firstline@gmail.com" method="post" novalidate>
        <input type="hidden" name="_subject" value="Website enquiry (EN)">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field field-wide">
          <label for="c-reason">Occasion</label>
          <select id="c-reason" name="Occasion">
            <option data-key="masa">Table at the restaurant</option>
            <option data-key="svatba">Wedding</option>
            <option data-key="firmeno">Corporate event</option>
            <option data-key="drugo">Other event</option>
          </select>
        </div>
        <div class="field">
          <label for="c-name">Name</label>
          <input id="c-name" name="Name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="c-phone">Phone</label>
          <input id="c-phone" name="Phone" type="tel" autocomplete="tel" required>
        </div>
        <div class="field field-wide">
          <label for="c-email">Email</label>
          <input id="c-email" name="Email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="c-date">Date</label>
          <input id="c-date" name="Date" type="date">
        </div>
        <div class="field">
          <label for="c-guests">Number of guests</label>
          <input id="c-guests" name="Guests" type="number" min="1" inputmode="numeric">
        </div>
        <div class="field field-wide">
          <label for="c-note">Message <span class="optional">(optional)</span></label>
          <textarea id="c-note" name="Message" rows="4"></textarea>
        </div>

        <div class="form-footer field-wide">
          <button class="btn" type="submit">Send enquiry</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </section>

</main>
